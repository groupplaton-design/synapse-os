name: agent-ci

# Track B: build and test the Veil Agent daemon.
# Hard gates: build, test, rustfmt, clippy (-D warnings).

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/agent-ci.yml'
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/agent-ci.yml'
  workflow_dispatch:

env:
  # Run JS actions on Node 24 (Node 20 is deprecated from June 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: agent

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent

      - name: Build
        run: cargo build --all --locked || cargo build --all

      - name: Test
        run: cargo test --all

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
