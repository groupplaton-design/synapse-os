name: agent-ci

# Track B: build and test the Veil Agent daemon.
# Gates merges on `cargo build` + `cargo test`; fmt/clippy are advisory for now
# and will be promoted to hard gates once the baseline is green.

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/agent-ci.yml'
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/agent-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: agent

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent

      - name: Build
        run: cargo build --all --locked || cargo build --all

      - name: Test
        run: cargo test --all

      - name: Format (advisory)
        run: cargo fmt --all --check
        continue-on-error: true

      - name: Clippy (advisory)
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true
