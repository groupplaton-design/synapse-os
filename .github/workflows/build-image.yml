name: build-image

# Builds the Veil OS image editions on GitHub runners and pushes to GHCR.
#   base            = Aurora + rebrand + branding
#   standard        = base + AI stack (Ollama)
#   standard-nvidia = aurora-nvidia + rebrand + branding + AI stack
# No local Linux required.

on:
  push:
    branches: [main]
    paths:
      - 'recipes/**'
      - 'assets/**'
      - '.github/workflows/build-image.yml'
  pull_request:
    paths:
      - 'recipes/**'
      - 'assets/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:
  schedule:
    # Weekly rebuild to pull in upstream Aurora/Fedora security updates.
    - cron: '0 6 * * 1'

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: tags
        run: echo "date=$(date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: ./recipes/base/Containerfile
          image: veil-base
          tags: latest ${{ steps.tags.outputs.date }}
          oci: true
      - if: github.event_name != 'pull_request'
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@v2
        with:
          image: veil-base
          tags: latest ${{ steps.tags.outputs.date }}
          registry: ${{ env.REGISTRY }}

  standard:
    needs: base
    # Skipped on PRs: it builds FROM the private veil-base, which only exists
    # after the base job pushes it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: tags
        run: echo "date=$(date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
      # Login BEFORE build so buildah can pull the private veil-base FROM image.
      - uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: ./recipes/standard/Containerfile
          image: veil-standard
          tags: latest ${{ steps.tags.outputs.date }}
          oci: true
      - uses: redhat-actions/push-to-registry@v2
        with:
          image: veil-standard
          tags: latest ${{ steps.tags.outputs.date }}
          registry: ${{ env.REGISTRY }}

  standard-nvidia:
    # NVIDIA base is large; only build it on demand or for a release tag.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: tags
        run: echo "date=$(date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: ./recipes/standard-nvidia/Containerfile
          image: veil-standard-nvidia
          tags: latest ${{ steps.tags.outputs.date }}
          oci: true
      - uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: redhat-actions/push-to-registry@v2
        with:
          image: veil-standard-nvidia
          tags: latest ${{ steps.tags.outputs.date }}
          registry: ${{ env.REGISTRY }}
