name: build-iso

# Heavy pipeline (~25-45 min): turn a DeamOS edition image into a bootable
# Anaconda installer ISO via bootc-image-builder, then publish it.
#
# DELIVERY: the ISO (~5-6 GB) is split into <2 GiB parts and published as
# GitHub Release assets. Release assets do NOT count against the Actions
# artifact-storage quota (which a >2 GiB ISO exhausts almost immediately) and
# have no per-account size cap — only a 2 GiB per-file cap, which the split
# sidesteps. Download all parts + SHA256SUMS and rejoin (see REASSEMBLE.txt).
# Permanent hosting moves to object storage (R2/S3) at public alpha.
#
# Triggers:
#   - workflow_dispatch  -> pick an edition
#   - tag v*             -> standard edition
# Run build-image first so the edition image exists in GHCR.

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition to build the ISO for'
        type: choice
        options:
          - standard
          - base
          - standard-nvidia
        default: standard
  push:
    tags:
      - 'v*'

env:
  # Default to the full standard edition (AI stack + agent); dispatch can pick
  # another. Tag builds fall back to standard.
  IMAGE: ghcr.io/${{ github.repository_owner }}/deamos-${{ github.event.inputs.edition || 'standard' }}:latest
  # Write the (large) ISO to the runner's roomy ephemeral disk, not the small /.
  OUT: /mnt/deamos-output
  # Run JS actions on Node 24 (Node 20 is deprecated from June 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          # Strip the runner's preinstalled bloat so the build tree fits on /.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache /usr/local/share/boost /usr/lib/jvm \
            /usr/local/lib/node_modules
          sudo docker image prune -af || true
          df -h / /mnt

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull edition image into storage
        run: sudo podman pull "$IMAGE"

      - name: Build installer ISO
        run: |
          sudo mkdir -p "$OUT"
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$OUT:/output" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --rootfs btrfs \
            --use-librepo=True \
            "$IMAGE"
          echo "--- output tree ---"
          sudo find "$OUT" -type f -printf '%p  %s bytes\n'

      - name: Fix output ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$OUT"

      - name: Checksum
        run: |
          ISO=$(find "$OUT" -name '*.iso' | head -n1)
          sha256sum "$ISO" | tee "$OUT/SHA256SUMS"

      - name: Split ISO into <2 GiB parts
        id: split
        run: |
          ISO=$(find "$OUT" -name '*.iso' | head -n1)
          cd "$OUT"
          # 1900 MiB parts stay safely under the 2 GiB per-asset cap.
          split -b 1900M -d "$ISO" deamos-install.iso.part
          ls -lh deamos-install.iso.part* SHA256SUMS
          echo "tag=iso-$(date +%Y%m%d-%H%M)-${{ github.event.inputs.edition || 'standard' }}" >> "$GITHUB_OUTPUT"

      - name: Reassembly instructions
        run: |
          cat > "$OUT/REASSEMBLE.txt" <<'EOF'
          DeamOS installer ISO — split into <2 GiB parts (GitHub release asset cap).
          Download every "deamos-install.iso.part*" file AND SHA256SUMS, then rejoin:

          Linux / macOS:
            cat deamos-install.iso.part* > install.iso

          Windows (PowerShell):
            $out=[System.IO.File]::Create("$PWD\install.iso")
            Get-ChildItem deamos-install.iso.part* | Sort-Object Name | ForEach-Object {
              $in=[System.IO.File]::OpenRead($_.FullName); $in.CopyTo($out); $in.Close() }
            $out.Close()

          Verify (the rejoined install.iso must match SHA256SUMS):
            Linux/macOS:  sha256sum install.iso
            Windows:      Get-FileHash install.iso -Algorithm SHA256
          EOF
          cat "$OUT/REASSEMBLE.txt"

      - name: Publish ISO parts to a Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$OUT"
          gh release create "${{ steps.split.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "DeamOS ISO ${{ steps.split.outputs.tag }}" \
            --notes "Standard DeamOS installer ISO, split into <2 GiB parts. Download all parts + SHA256SUMS and rejoin per REASSEMBLE.txt." \
            deamos-install.iso.part* SHA256SUMS REASSEMBLE.txt
