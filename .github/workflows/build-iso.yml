name: build-iso

# Heavy pipeline (~25-45 min): turn a Veil OS edition image into a bootable
# Anaconda installer ISO via bootc-image-builder, uploaded as a workflow
# artifact (standard edition is ~5-6 GB).
#
# NOTE: the ISO is NOT published to GitHub Releases — release assets are capped
# at 2 GiB and our ISO is larger. Permanent hosting will move to object storage
# (R2/S3) when there is a public alpha. For now: download from the run's
# Artifacts. See iso/README.md.
#
# Triggers:
#   - workflow_dispatch  -> pick an edition
#   - tag v*             -> standard edition
# Run build-image first so the edition image exists in GHCR.

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition to build the ISO for'
        type: choice
        options:
          - standard
          - base
          - standard-nvidia
        default: standard
  push:
    tags:
      - 'v*'

env:
  # Default to the full standard edition (AI stack + agent); dispatch can pick
  # another. Tag builds fall back to standard.
  IMAGE: ghcr.io/${{ github.repository_owner }}/veil-${{ github.event.inputs.edition || 'standard' }}:latest
  # Write the (large) ISO to the runner's roomy ephemeral disk, not the small /.
  OUT: /mnt/veil-output
  # Run JS actions on Node 24 (Node 20 is deprecated from June 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          # Strip the runner's preinstalled bloat so the build tree fits on /.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache /usr/local/share/boost /usr/lib/jvm \
            /usr/local/lib/node_modules
          sudo docker image prune -af || true
          df -h / /mnt

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull edition image into storage
        run: sudo podman pull "$IMAGE"

      - name: Build installer ISO
        run: |
          sudo mkdir -p "$OUT"
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$OUT:/output" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --rootfs btrfs \
            --use-librepo=True \
            "$IMAGE"
          echo "--- output tree ---"
          sudo find "$OUT" -type f -printf '%p  %s bytes\n'

      - name: Fix output ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$OUT"

      - name: Checksum
        run: |
          ISO=$(find "$OUT" -name '*.iso' | head -n1)
          sha256sum "$ISO" | tee "$OUT/SHA256SUMS"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: veil-os-iso
          path: |
            ${{ env.OUT }}/**/*.iso
            ${{ env.OUT }}/SHA256SUMS
          retention-days: 90
          if-no-files-found: error
