name: build-iso

# Heavy pipeline (~20-40 min): turn the veil-base OCI image into a bootable
# Anaconda installer ISO via bootc-image-builder, uploaded as a workflow
# artifact (~4.5 GB).
#
# NOTE: the ISO is NOT published to GitHub Releases — release assets are capped
# at 2 GiB and our ISO is larger. Permanent hosting will move to object storage
# (R2/S3) when there is a public alpha. For now: download from the run's
# Artifacts. See iso/README.md.
#
# Triggers:
#   - workflow_dispatch  -> click "Run workflow"
#   - tag v*             -> tagged build
# Run build-image first so ghcr.io/<owner>/veil-base:latest exists.

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition to build the ISO for'
        type: choice
        options:
          - standard
          - base
          - standard-nvidia
        default: standard
  push:
    tags:
      - 'v*'

env:
  # Default to the full standard edition (AI stack + agent); dispatch can pick
  # another. Tag builds fall back to standard.
  IMAGE: ghcr.io/${{ github.repository_owner }}/veil-${{ github.event.inputs.edition || 'standard' }}:latest
  # Run JS actions on Node 24 (Node 20 is deprecated from June 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          # ISO builds need room; strip the runner's preinstalled bloat.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull base image into storage
        run: sudo podman pull "$IMAGE"

      - name: Build installer ISO
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/output:/output" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --rootfs btrfs \
            --use-librepo=True \
            "$IMAGE"
          echo "--- output tree ---"
          sudo find output -type f -printf '%p  %s bytes\n'

      - name: Fix output ownership
        # bootc-image-builder writes the ISO as root; later steps run as the
        # runner user and otherwise cannot read it.
        run: sudo chown -R "$(id -u):$(id -g)" output

      - name: Checksum
        run: |
          ISO=$(sudo find output -name '*.iso' | head -n1)
          sudo sha256sum "$ISO" | tee output/SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: veil-os-iso
          path: |
            output/**/*.iso
            output/SHA256SUMS
          retention-days: 90
          if-no-files-found: error
