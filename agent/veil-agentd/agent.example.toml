# Example veil-agentd config. Copy to /etc/veil/agent.toml to override defaults.
# Every field is optional — omitted fields fall back to built-in defaults.

# Local API bind address (loopback only; the agent is a local service).
listen_addr = "127.0.0.1"
listen_port = 7421

# Log level when RUST_LOG is unset: trace | debug | info | warn | error
log_level = "info"

# --- Filesystem tool guardrails ---------------------------------------------
# Roots the fs tools may read from. EMPTY = nothing readable (safe default).
# Example: fs_allowed_roots = ["/home/user/Documents", "/home/user/Projects"]
fs_allowed_roots = []

# Largest single read, in bytes (default 1 MiB).
fs_max_read_bytes = 1048576

# Require interactive approval for tool actions. While true and no omnibox
# approver is attached, guarded actions are denied. Set false for headless use.
require_approval = true

# --- Local LLM (Ollama) -----------------------------------------------------
ollama_url = "http://127.0.0.1:11434"
default_model = "llama3.2"
