[package]
name = "veil-agentd"
version = "0.1.0"
edition = "2021"
description = "Veil Agent — system-level AI daemon for Veil OS"
license = "Apache-2.0"
repository = "https://github.com/agent4bnk-spec/synapse-os"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
